---
layout: default
---
<article class="post">
  <header class="post-head">
    <span class="date">{{ page.date | date: "%Y.%m.%d" }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.tags %}
    <div class="tags">
      {% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-foot">
    <a href="{{ '/' | relative_url }}">&#9664; back to base</a>
  </footer>
</article>
