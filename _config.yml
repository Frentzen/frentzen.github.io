title: Frentzen's Security Notes
description: Application security write-ups, CVE walkthroughs, and defensive engineering.
author: Frentzen
email: frentzenamaral@gmail.com

# User site served at the domain root.
# For a project repo named "blog", set baseurl: "/blog" and url accordingly.
url: "https://frentzen.github.io"
baseurl: ""

theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

minima:
  social_links:
    github: Frentzen

# Exclude tooling files from the build.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
